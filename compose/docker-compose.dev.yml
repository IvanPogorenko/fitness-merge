services:
  backend:
    build:
      context: ../baackendFitness
      dockerfile: Dockerfile
    container_name: fitness-backend-dev
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    volumes:
      - ../baackendFitness:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      - postgres
    networks:
      - fitness-network

  frontend:
    build:
      context: ../frontendFitness
      dockerfile: Dockerfile
    container_name: fitness-frontend-dev
    ports:
      - "${FRONTEND_PORT}:4200"
    environment:
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      - ../frontendFitness:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - fitness-network

  postgres:
    image: postgres:17-alpine
    container_name: fitness-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - fitness-network

  adminer:
    image: adminer:latest
    container_name: fitness-adminer-dev
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - fitness-network
    profiles:
      - tools

networks:
  fitness-network:
    driver: bridge

volumes:
  postgres-data-dev: