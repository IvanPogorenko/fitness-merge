services:
  backend:
    build:
      context: ../baackendFitness
      dockerfile: Dockerfile.prod
    container_name: fitness-backend
    restart: on-failure
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      - postgres
    networks:
      - fitness-network

  frontend:
    build:
      context: ../frontendFitness
      dockerfile: Dockerfile.prod
    container_name: fitness-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL}
    depends_on:
      - backend
    networks:
      - fitness-network

  postgres:
    image: postgres:17-alpine
    container_name: fitness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fitness-network

  adminer:
    image: adminer:latest
    container_name: fitness-adminer-prod
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - fitness-network
    profiles:
      - tools

networks:
  fitness-network:
    driver: bridge

volumes:
  postgres-data: